<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="thesis-body">
    <a href="#thesis-reader" class="skip-link">skip to thesis</a>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo" aria-label="Alex Wyrick Home">
                <img src="images/H.logo.svg" alt="H" class="logo-svg">
            </a>

            <nav class="nav" role="navigation">
                <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                    <span class="nav-toggle-line"></span>
                    <span class="nav-toggle-line"></span>
                </button>
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">work</a></li>
                    <li><a href="process.html" class="nav-link">process</a></li>
                    <li><a href="mission.html" class="nav-link">mission</a></li>
                    <li><a href="vision.html" class="nav-link">vision test</a></li>
                    <li><a href="about.html" class="nav-link">about</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="thesis-reader" class="thesis-reader">
        <div class="thesis-toolbar" role="toolbar" aria-label="Thesis reader controls">
            <div class="thesis-toolbar-meta">
                <h1 class="thesis-title">Master's Thesis</h1>
                <p class="thesis-subtitle">Interaction Design · Strate École - Paris • 2017</p>
            </div>

            <div class="thesis-toolbar-controls">
                <div class="thesis-page-controls" hidden>
                    <button type="button" class="thesis-btn thesis-btn--icon" id="thesisPrev" aria-label="Previous page">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <label class="thesis-page-label" for="thesisPageInput">
                        <span class="visually-hidden">Page</span>
                        <input type="number" id="thesisPageInput" class="thesis-page-input" min="1" value="1" inputmode="numeric">
                        <span class="thesis-page-total" id="thesisPageTotal">/ —</span>
                    </label>
                    <button type="button" class="thesis-btn thesis-btn--icon" id="thesisNext" aria-label="Next page">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>

                <div class="thesis-zoom-controls" hidden>
                    <button type="button" class="thesis-btn thesis-btn--icon" id="thesisZoomOut" aria-label="Zoom out">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                    </button>
                    <button type="button" class="thesis-btn thesis-btn--icon" id="thesisZoomIn" aria-label="Zoom in">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                    </button>
                </div>

                <a href="docs/thesis.pdf" class="thesis-btn thesis-btn--primary" download="Herman-Alexander-Thesis.pdf">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download
                </a>
            </div>
        </div>

        <div class="thesis-viewport" id="thesisViewport" tabindex="0" aria-label="Thesis PDF pages">
            <div class="thesis-status" id="thesisStatus" role="status">Loading thesis…</div>
            <div class="thesis-pages" id="thesisPages" aria-live="polite"></div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
    <script src="js/thesis-reader.js"></script>
</body>
</html>
